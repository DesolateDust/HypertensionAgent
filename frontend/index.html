<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>端侧高血压管理助手 Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel left-panel">
        <h2>🛠️ 端侧体征模拟面板</h2>
        <div class="form-group">
            <label>选择当前端侧用户 (后台动态同步)：</label>
            <select id="userSelect" onchange="clearChat()"></select>
        </div>

        <div class="form-group"><label>当前模拟天数标记 (如 Day 11):</label><input type="text" id="currentDay" value="Day 11"></div>
        <div class="form-group"><label>睡眠时长 (小时):</label><input type="number" id="sleep" value="6.5" step="0.1"></div>
        <div class="form-group"><label>起夜次数 (次):</label><input type="number" id="awake" value="3"></div>
        <div class="form-group"><label>日间静息心率 (bpm):</label><input type="number" id="dayHr" value="75"></div>
        <div class="form-group"><label>夜间静息心率 (bpm):</label><input type="number" id="nightHr" value="70"></div>
        <div class="form-group"><label>今日步数:</label><input type="number" id="steps" value="4000"></div>

        <button class="btn-alert" onclick="injectData()">🚀 同步传感器数据并触发评估</button>
    </div>

    <div class="panel right-panel">
        <h2>🤖 AI 伴诊助手</h2>
        <div id="chat-box">
            <div class="msg ai">已同步用户数据。请在左侧输入新数据或直接向我提问。</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="咨询健康建议...">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        // 【修复 1 落地：页面加载时向后端请求真实用户】
        window.onload = async function() {
            try {
                const res = await fetch(`${API_BASE}/api/users`);
                const data = await res.json();
                const select = document.getElementById("userSelect");
                select.innerHTML = "";
                data.users.forEach(user => {
                    let option = document.createElement("option");
                    option.value = user;
                    // 对 10天测试用户做个醒目标记
                    option.innerText = user === "stress_non_dipper_10days_user" ? `⭐ [10天时序测试组] ${user}` : user;
                    select.appendChild(option);
                });
            } catch (e) {
                alert("无法连接到后端，请确保 main.py 正在运行！");
            }
        };

        function clearChat() {
            document.getElementById("chat-box").innerHTML = '<div class="msg ai">已切换用户，历史体征已加载，我是您的专属管家。</div>';
        }

        function appendMessage(text, type) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = `msg ${type}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function injectData() {
            const btn = document.querySelector('.btn-alert');
            btn.innerText = "正在分析多日趋势...";
            btn.disabled = true;

            const payload = {
                user_id: document.getElementById("userSelect").value,
                current_day: document.getElementById("currentDay").value, // 传入天数
                sleep_hours: parseFloat(document.getElementById("sleep").value),
                awakenings: parseInt(document.getElementById("awake").value),
                day_hr: parseInt(document.getElementById("dayHr").value),
                night_hr: parseInt(document.getElementById("nightHr").value),
                steps: parseInt(document.getElementById("steps").value)
            };

            try {
                const res = await fetch(`${API_BASE}/api/inject_and_analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                appendMessage("【主动预警】 " + data.ai_alert, "alert");
            } catch (e) {
                appendMessage("系统连接失败", "alert");
            } finally {
                btn.innerText = "🚀 同步传感器数据并触发评估";
                btn.disabled = false;
            }
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const msg = input.value.trim();
            if(!msg) return;
            appendMessage(msg, "user");
            input.value = "";
            const payload = { user_id: document.getElementById("userSelect").value, message: msg };
            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                const data = await res.json();
                appendMessage(data.reply, "ai");
            } catch (e) { appendMessage("发送失败...", "ai"); }
        }
    </script>
</body>
</html>
